<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encontre um professor de idiomas disponível para o seu horário."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Encontre um Professor</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar o "flash" branco.
      ;(function () {
        try {
          var tema = localStorage.getItem('tema')
          if (tema !== 'claro' && tema !== 'escuro') {
            tema = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'escuro'
              : 'claro'
          }
          if (tema === 'escuro') document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage indisponível: segue no tema claro */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
